<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b6f51a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เงินห้อง">
<meta name="format-detection" content="telephone=no">
<title>เงินห้อง – ระบบเก็บเงินสำหรับเหรัญญิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --lime:#b6f51a;--lime-soft:#e8fca0;--green:#6fa300;--green-dark:#3f6200;
  --bg:#f7f7f7;--card:#fff;--text:#222;--muted:#777;--line:#e6e6e6;
  --shadow:0 4px 16px rgba(0,0,0,.06);--radius:20px;
  --red:#ffe1e1;--redInk:#b3261e;--yellow:#fff0c2;--yellowInk:#8a5a00;--inInk:#2e7d32;--outInk:#c62828;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;width:100%}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
img{display:block;max-width:100%}
.hide{display:none!important}
.money{font-variant-numeric:tabular-nums}
.in{color:var(--inInk)}.out{color:var(--outInk)}
.sub{color:var(--muted);font-size:13px}

#view{width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(100px + var(--sab))}
#view.noNav{padding-bottom:24px}
.wrap{padding:0 16px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--sat)) 16px 8px}
.topbar h1{font-size:24px;flex:1;line-height:1.2}
.topbar .actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:14px;background:#efeff1;display:grid;place-items:center;font-size:24px;flex:none}
.brand-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);margin-right:8px;box-shadow:0 0 0 3px var(--lime-soft)}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#43d17a;display:inline-block;box-shadow:0 0 8px #43d17a}
.sync-dot.busy{background:#ffc400;box-shadow:0 0 8px #ffc400;animation:pulse 1s infinite}
.sync-dot.err{background:#ff5252;box-shadow:0 0 8px #ff5252}
@keyframes pulse{50%{opacity:.4}}
.topsub{padding:0 16px 6px;color:var(--muted);font-size:14px}

/* ---------- notice ---------- */
.notice{background:#fbf6d0;padding:14px 46px 14px 18px;display:flex;gap:12px;align-items:flex-start;position:relative}
.notice svg{flex:none;margin-top:2px}
.notice h4{font-size:16px;margin-bottom:2px}.notice p{font-size:14px;line-height:1.5}
.notice .close{position:absolute;right:12px;top:10px;font-size:26px;color:#8a6d00}

/* ---------- profile card ---------- */
.profile-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:8px 16px}
.profile-row{display:flex;align-items:center;gap:14px;padding:16px}
.avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--lime);background:#f3ffd0;display:grid;place-items:center;font-weight:700;color:var(--green);font-size:20px;flex:none}
.profile-row .info{flex:1;min-width:0}
.profile-row .name{font-weight:700;font-size:17px}
.profile-row .sub{display:block}
.switch-btn{width:52px;height:52px;border-radius:16px;background:#eceef2;display:grid;place-items:center;font-size:22px;flex:none}
.chips2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.chip2{border-radius:14px;padding:12px 14px;background:#f1f1f1;text-align:left}
.chip2 small{display:block;font-size:12px;color:#556}
.chip2 b{font-size:18px}
.chip2.hl{background:linear-gradient(120deg,var(--lime-soft),var(--lime))}
.promo-strip{width:100%;background:linear-gradient(90deg,#e8fffb,#19d3c5);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.promo-strip b{font-size:17px;display:block}.promo-strip small{font-size:13px}
.promo-strip span{font-size:28px}

/* ---------- banner ---------- */
.banner{margin:12px 16px;border-radius:var(--radius);min-height:170px;background:linear-gradient(120deg,#d9ff6a,#7de3b5 60%,#4cc9f0);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:block;width:calc(100% - 32px);text-align:left;color:#173300}
.banner small{font-size:13px;opacity:.8}
.banner h2{font-size:24px;line-height:1.25;margin:4px 0 10px;max-width:80%}
.banner .bar{background:rgba(255,255,255,.5);max-width:420px}
.banner .circle{position:absolute;right:-30px;bottom:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.35)}
.banner>*{position:relative;z-index:1}.banner .circle{z-index:0}

/* ---------- tile grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 16px 16px}
.tile{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;box-shadow:var(--shadow);border:2px solid transparent;position:relative;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .1s;color:#333}
.tile:active{transform:scale(.96)}
.tile svg{width:42px;height:42px}
.tile span{font-size:13.5px;line-height:1.25}
.tag-new{position:absolute;top:0;right:0;background:linear-gradient(135deg,#ff9a3c,#ff5a36);color:#fff;font-size:11px;padding:3px 10px;border-radius:0 12px 0 14px}

/* ---------- sections / cards / lists ---------- */
.section-title{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px}
.section-title h3{font-size:19px}
.section-title a{color:var(--green);font-size:14px;font-weight:500;cursor:pointer}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 16px;padding:16px}
.cards-grid{display:grid;grid-template-columns:1fr;gap:0}
.rcard{display:block;width:calc(100% - 32px);text-align:left;margin:10px 16px}
.rcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.rcard b{font-size:16px;font-weight:600;display:block}
.bar{height:8px;border-radius:8px;background:#ececec;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--lime),var(--green));transition:width .4s}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:3px 11px;white-space:nowrap;font-weight:500}
.tag.ok{background:var(--lime-soft);color:var(--green-dark)}.tag.part{background:var(--yellow);color:var(--yellowInk)}
.tag.no{background:var(--red);color:var(--redInk)}.tag.due{background:#ffe9d6;color:#b85400}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 16px;margin:10px 16px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px dashed var(--line);text-align:left}
.item:last-child{border:0}
.item .no{width:34px;height:34px;border-radius:50%;background:var(--lime-soft);color:var(--green-dark);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ic{width:42px;height:42px;border-radius:14px;background:#f1f6e3;display:grid;place-items:center;flex:none;overflow:hidden;color:var(--green-dark)}
.item .ic svg{width:26px;height:26px}
.item .ic img{width:100%;height:100%;object-fit:cover}
.item .amt{font-weight:600;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:#bbb;margin:0 auto 8px;display:block}
.empty b{color:var(--text);display:block}
.empty p{margin:4px 0 12px;font-size:14px}

/* ---------- segmented tabs ---------- */
.tabs{display:flex;background:#fff;border-radius:99px;padding:6px;margin:8px 16px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:10px 4px;border-radius:99px;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--lime);color:#222;font-weight:600}

/* ---------- forms / buttons ---------- */
label{font-size:14px;color:var(--muted);display:block;margin:12px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:13px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;-webkit-appearance:none;appearance:none;min-height:50px}
select{background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{border-radius:18px;resize:none;min-height:96px;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
.search{margin:6px 16px 4px;width:calc(100% - 32px)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;font-size:15px;transition:.15s}
.chip.on{background:var(--lime-soft);border-color:var(--lime);color:var(--green-dark);font-weight:600}
.cta{display:block;width:calc(100% - 32px);margin:12px 16px;padding:16px;border-radius:16px;background:var(--lime);color:#222;font-size:18px;font-weight:700;transition:.15s;text-align:center}
.cta:active,.chip:active,.btn:active{transform:scale(.97)}
.cta.inline{width:100%;margin:16px 0 0}
.cta.ghost{background:#fff;border:2px solid var(--line)}
.cta.danger{background:#fff;color:var(--outInk);border:2px solid #f3c6c6}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:99px;font-size:14px;background:#fff;border:2px solid var(--line)}
.btn.p{background:var(--lime);border-color:var(--lime);font-weight:600}.btn.sm{padding:6px 14px;font-size:13px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:14px 16px;line-height:1.7}
.hint a{color:var(--green);text-decoration:underline;cursor:pointer}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.photo{position:relative;border-radius:18px;overflow:hidden;margin-top:12px;background:#f3f5fa}
.photo img{width:100%;max-height:260px;object-fit:contain}
.photo button{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff}
.actionrow{display:flex;gap:10px;margin-top:12px}
.actionrow button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:11px 6px;font-size:14px}
.actionrow svg{width:22px;height:22px}

/* ---------- auth / setup ---------- */
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(24px + var(--sat)) 16px 24px;background:linear-gradient(160deg,#f3ffd0 0,#f7f7f7 45%)}
.auth-card{width:100%;max-width:520px;background:var(--card);border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:28px 22px}
.auth-card .logo{text-align:center;margin-bottom:6px}
.auth-card .logo svg{width:64px;height:64px;color:var(--green)}
.auth-card h1{text-align:center;font-size:26px;margin-bottom:4px}
.auth-card .lead{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px;line-height:1.6}
.pin-input{text-align:center;font-size:28px;font-weight:700;letter-spacing:14px;padding-left:28px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- bottom nav (mobile/tablet) ---------- */
#nav{position:fixed;left:0;bottom:0;width:100%;height:calc(84px + var(--sab));background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-bottom:calc(10px + var(--sab));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#555}
.tab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green);font-weight:700}
.scan{position:relative}
.scan .bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.scan .bubble i{width:56px;height:56px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:#222}
.scan span{margin-top:38px}

/* ---------- sheet / toast ---------- */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:.25s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;width:100%;background:#fff;border-radius:28px 28px 0 0;z-index:41;transform:translateY(105%);transition:transform .3s;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 20px calc(24px + var(--sab))}
#sheet.on{transform:none}
#sheet .grab{width:48px;height:6px;border-radius:6px;background:#ddd;margin:0 auto 14px}
#sheet h2{font-size:22px;margin-bottom:8px}
#sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#sheet .head button{font-size:32px;line-height:1}
#sheet .grid{padding:0 0 8px}
#sheet .tile{box-shadow:none;background:#fafafa}
#sheet .list,#sheet .card{margin-left:0;margin-right:0;box-shadow:none;background:#fafafa}
#toast{position:fixed;left:50%;bottom:calc(104px + var(--sab));transform:translate(-50%,20px);background:#222;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.fade{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#printDoc{display:none}
@media print{
  body>*{display:none!important}
  #printDoc{display:block!important;padding:16px;font-family:'Noto Sans Thai',sans-serif;color:#000;background:#fff}
  #printDoc table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  #printDoc th,#printDoc td{border:1px solid #888;padding:4px 6px;text-align:left}
  #printDoc td.r,#printDoc th.r{text-align:right}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- very small phones ---------- */
@media(max-width:360px){
  .grid{gap:8px;padding-left:12px;padding-right:12px}
  .tile span{font-size:12px}.tile svg{width:36px;height:36px}
  .banner h2{font-size:20px}
}

/* ---------- tablet / iPad ---------- */
@media(min-width:768px){
  .topbar{padding:calc(24px + var(--sat)) 28px 8px}.topbar h1{font-size:30px}
  .topsub{padding:0 28px 6px}
  .profile-card,.banner,.card,.list,.tabs{margin-left:28px;margin-right:28px}
  .banner{width:calc(100% - 56px);min-height:200px;padding:30px 36px}.banner h2{font-size:32px}
  .grid{grid-template-columns:repeat(4,1fr);gap:16px;padding:12px 28px 20px}
  .tile{min-height:130px}.tile svg{width:52px;height:52px}.tile span{font-size:15px}
  .chips2{grid-template-columns:repeat(4,1fr)}
  .section-title{padding:12px 32px 4px}
  .cards-grid{grid-template-columns:1fr 1fr;padding:0 18px}
  .rcard{width:auto;margin:10px}
  .cta{width:calc(100% - 56px);margin-left:28px;margin-right:28px}
  .search{margin-left:28px;margin-right:28px;width:calc(100% - 56px)}
  .notice{padding-left:28px}
  #sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(640px,92vw);max-height:86vh;border-radius:28px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.25s}
  #sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  #sheet .grab{display:none}
  .toast{bottom:110px}
}

/* ---------- desktop / laptop : sidebar ---------- */
@media(min-width:1100px){
  #view:not(.noNav){padding-left:248px;padding-bottom:40px}
  #nav{top:0;bottom:0;left:0;width:248px;height:100vh;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:92px 16px 20px;border-top:0;border-right:1px solid var(--line)}
  #nav::before{content:"เงินห้อง";position:absolute;top:28px;left:28px;font-weight:700;font-size:22px;color:var(--green-dark)}
  #nav::after{content:"";position:absolute;top:36px;left:16px;width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px var(--lime-soft)}
  .tab{flex-direction:row;gap:14px;font-size:16px;padding:12px 16px;border-radius:14px}
  .tab svg{width:26px;height:26px}
  .tab:hover{background:#f3f3f3}
  .tab.on{background:var(--lime-soft)}
  .scan{order:-1;margin-bottom:8px;background:var(--lime);color:#222;font-weight:700}
  .scan:hover{background:var(--lime)}
  .scan .bubble{position:static;transform:none;width:auto;height:auto;background:none;box-shadow:none}
  .scan .bubble i{width:auto;height:auto;background:none}
  .scan span{margin-top:0}
  .tile:hover{border-color:var(--lime);transform:translateY(-2px)}
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:8px;align-content:start;padding:0 20px}
  .home-grid .notice{grid-column:1/-1;border-radius:16px;margin:20px 8px 8px}
  .home-grid .tiles{grid-column:1/-1}
  .home-grid .grid{grid-template-columns:repeat(8,1fr);padding-left:8px;padding-right:8px}
  .home-grid .profile-card,.home-grid .banner{margin-left:8px;margin-right:8px}
  .home-grid .banner{width:auto;margin-top:8px;min-height:230px}
  .home-grid .col{min-width:0}
  .home-grid .cards-grid{grid-template-columns:1fr;padding:0}
  .home-grid .rcard,.home-grid .list,.home-grid .card{margin-left:8px;margin-right:8px;width:auto}
  .home-grid .col .rcard{width:calc(100% - 16px)}
  .pg{padding:0 20px}
  .cards-grid{grid-template-columns:repeat(3,1fr)}
  .list.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
  .list.cols .item:nth-last-child(2):nth-child(odd){border-bottom:0}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:8px;align-items:start}
  #toast{bottom:40px;left:calc(50% + 124px)}
  .cta{width:auto;min-width:260px;margin-left:28px}
}
@media(min-width:1600px){html{font-size:17px}}
</style>
</head>
<body>
<noscript><p style="padding:24px">กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานแอป</p></noscript>
<main id="view"></main>
<nav id="nav" class="hide"></nav>
<div id="sheetBg" data-act="closeSheet"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div><canvas id="fx"></canvas><div id="printDoc"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fileGal" accept="image/*" class="hide">
<input type="file" id="fileJson" accept="application/json,.json" class="hide">

<script>
/* ---------- Supabase Config ---------- */
const SUPABASE_URL = 'https://iejmwihipfvtkbvjtude.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_PybXrP5brR32CHIw3nm8Lg_-SruBwlg';
const APP_PASSCODE = '404';
const DOC_ROW_ID = 'main_class_fund';
const AUTH_KEY = 'classfund_auth_404';

const sb = (window.supabase && typeof window.supabase.createClient === 'function')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- icons (เส้นบาง สไตล์เดียวกับแอปต้นแบบ) ---------- */
const IC={

/* ---------- state / storage / Supabase Sync ---------- */
const MEM={};const KEY='classfund_v1';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}};
const blank=()=>({cls:null,students:[],rounds:[],pays:[],exps:[]});
let S;try{S=JSON.parse(store.get(KEY)||'null')}catch(e){S=null}
S=Object.assign(blank(),S||{});

let isAuthed = (function(){try{return sessionStorage.getItem(AUTH_KEY)==='1'}catch(e){return false}})();
let isLoadingCloud=false, syncState='ok', isApplyingRemote=false, rtStarted=false;

function setSyncStatus(st){
  syncState=st;
  document.querySelectorAll('.sync-dot').forEach(el=>{el.className='sync-dot'+(st==='busy'?' busy':st==='err'?' err':'')});
}
async function loadFromCloud(){
  isLoadingCloud=true;draw();setSyncStatus('busy');
  try{
    if(!sb)throw new Error('Supabase library not loaded');
    const {data,error}=await sb.from('class_fund_state').select('data').eq('id',DOC_ROW_ID).maybeSingle();
    if(error)throw error;
    if(data&&data.data&&data.data.cls){
      S=Object.assign(blank(),data.data);store.set(KEY,JSON.stringify(S));
    }else if(S.cls){await saveToCloud()}
    setSyncStatus('ok');
    subscribeRealtime();
  }catch(e){
    console.error('Supabase load error:',e);setSyncStatus('err');
    toast('เชื่อมต่อฐานข้อมูลไม่ได้ ใช้ข้อมูลในเครื่องชั่วคราว');
  }finally{
    isLoadingCloud=false;view=S.cls?'home':'setup';draw();
  }
}
async function saveToCloud(){
  if(isApplyingRemote||!sb)return;
  setSyncStatus('busy');
  try{
    const {error}=await sb.from('class_fund_state').upsert({id:DOC_ROW_ID,data:S,updated_at:new Date().toISOString()},{onConflict:'id'});
    if(error)throw error;setSyncStatus('ok');
  }catch(e){
    console.error('Supabase save error:',e);setSyncStatus('err');
    toast('บันทึกขึ้นคลาวด์ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือตาราง SQL');
  }
}
function save(){
  try{store.set(KEY,JSON.stringify(S))}catch(e){toast('พื้นที่เก็บข้อมูลในเครื่องเต็ม')}
  if(isAuthed)saveToCloud();
}
function subscribeRealtime(){
  if(rtStarted||!sb)return;rtStarted=true;
  try{
    sb.channel('class_fund_realtime')
     .on('postgres_changes',{event:'*',schema:'public',table:'class_fund_state',filter:'id=eq.'+DOC_ROW_ID},payload=>{
       if(!isAuthed||!payload.new||!payload.new.data)return;
       const incoming=JSON.stringify(payload.new.data);
       if(incoming!==JSON.stringify(S)){
         isApplyingRemote=true;
         S=Object.assign(blank(),payload.new.data);store.set(KEY,incoming);
         if(!S.cls)view='setup';else if(view==='setup')view='home';
         if(!$('sheet').classList.contains('on'))draw();
         isApplyingRemote=false;
       }
     }).subscribe();
  }catch(e){console.warn('realtime unavailable',e)}
}

const TH_S=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fd(k){if(!k)return '-';const p=k.split('-');return (+p[2])+' '+TH_S[+p[1]-1]+' '+((+p[0]+543)%100)}
function fm(n){n=Math.round((+n||0)*100)/100;return n.toLocaleString('th-TH',{maximumFractionDigits:2})}

function confetti(){const c=$('fx'),x=c.getContext&&c.getContext('2d');if(!x)return;c.width=innerWidth;c.height=innerHeight;
 const P=[...Array(50)].map(()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6+3,c:['#b6f51a','#4cc9f0','#ffd23f','#6fa300'][Math.random()*4|0],l:55}));
 (function f(){x.clearRect(0,0,c.width,c.height);let a=0;P.forEach(p=>{if(p.l<=0)return;a++;p.l--;p.vy+=.5;p.x+=p.vx;p.y+=p.vy;x.globalAlpha=p.l/55;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(a)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

 fr.onerror=()=>toast('อ่านไฟล์ไม่สำเร็จ');fr.readAsDataURL(file)}

/* ---------- logic ---------- */
function paidOf(rid,sid){return S.pays.filter(p=>p.rid===rid&&p.sid===sid).reduce((a,p)=>a+p.amt,0)}
function stat(r){const n=S.students.length;let full=0,part=0,got=0;S.students.forEach(s=>{const p=paidOf(r.id,s.id);got+=p;if(p>=r.amt)full++;else if(p>0)part++});
 return {n,full,part,none:n-full-part,got,target:r.amt*n,pct:n?Math.round(full/n*100):0,over:r.due&&r.due<TODAY()}}
const income=()=>S.pays.reduce((a,p)=>a+p.amt,0);
const spent=()=>S.exps.reduce((a,e)=>a+e.amt,0);
function unpaid(r){return S.students.filter(s=>paidOf(r.id,s.id)<r.amt)}
function owedAll(){let t=0;S.rounds.forEach(r=>S.students.forEach(s=>{t+=Math.max(0,r.amt-paidOf(r.id,s.id))}));return t}
function summaryText(){const c=S.cls;let t='สรุปเงินห้อง '+c.name+' ('+c.term+')\nอัปเดต '+fd(TODAY())+'\n';
 t+='\nรับรวม '+fm(income())+' บาท\nจ่ายรวม '+fm(spent())+' บาท\nคงเหลือ '+fm(income()-spent())+' บาท\n';
 S.rounds.forEach(r=>{const s=stat(r);t+='\n'+r.title+' ('+fm(r.amt)+' บาท/คน)\nจ่ายแล้ว '+s.full+'/'+s.n+' คน';const u=unpaid(r);if(u.length)t+='\nค้าง: '+u.map(x=>x.name).join(', ');t+='\n'});
 t+='\n- '+c.treasurer+' เหรัญญิก';return t}
function copyText(t,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(msg||'คัดลอกแล้ว'),()=>fallbackCopy(t,msg));else fallbackCopy(t,msg)}
function fallbackCopy(t,msg){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg||'คัดลอกแล้ว')}catch(e){openSheet('<h2>คัดลอกข้อความนี้</h2><textarea style="min-height:220px">'+esc(t)+'</textarea>')}document.body.removeChild(a)}
function download(name,type,data){try{const b=new Blob([data],{type:type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}}

  S.pays.push({id:uid('p'),rid:payDraft.rid,sid:payDraft.sid,amt:a,method:payDraft.method,date:payDraft.date,slip:payDraft.slip});save();closeSheet();const r=S.rounds.find(x=>x.id===payDraft.rid);if(r&&stat(r).full===S.students.length)confetti();draw();toast('บันทึกรับเงินแล้ว')},
 delPay(t){if(!confirm('ลบรายการรับเงินนี้?'))return;S.pays=S.pays.filter(p=>p.id!==t.dataset.id);save();closeSheet();draw()},
 viewPay(t){const p=S.pays.find(x=>x.id===t.dataset.id);if(!p)return;const s=S.students.find(x=>x.id===p.sid),r=S.rounds.find(x=>x.id===p.rid);
  openSheet('<h2>'+esc(s?s.name:'')+'</h2><p class="sub">'+esc(r?r.title:'')+' · '+fd(p.date)+' · '+esc(p.method)+'</p><div class="big in money" style="margin:6px 0">+'+fm(p.amt)+' บาท</div>'+(p.slip?'<img style="width:100%;border-radius:16px" src="'+p.slip+'" alt="สลิป">':'<p class="sub">ไม่ได้แนบสลิป</p>')+'<button class="cta inline danger" data-act="delPay" data-id="'+p.id+'">ลบรายการนี้</button>')},
 newExp(){expDraft={title:'',amt:'',date:TODAY(),note:'',receipt:null};expSheet()},
 expPhoto(t){syncExp();askPhoto('exp',!!t.dataset.cam)},
 rmRec(){syncExp();expDraft.receipt=null;expSheet()},
 saveExp(){syncExp();const a=parseFloat(expDraft.amt);if(!expDraft.title.trim())return toast('ใส่ชื่อรายการก่อนนะ');if(!(a>0))return toast('ใส่จำนวนเงินก่อนนะ');
  S.exps.push({id:uid('e'),title:expDraft.title.trim(),amt:a,date:expDraft.date,note:expDraft.note,receipt:expDraft.receipt});save();closeSheet();draw();toast('บันทึกรายจ่ายแล้ว')},
 viewExp(t){const e=S.exps.find(x=>x.id===t.dataset.id);if(!e)return;openSheet('<h2>'+esc(e.title)+'</h2><p class="sub">'+fd(e.date)+(e.note?' · '+esc(e.note):'')+'</p><div class="big out money" style="margin:6px 0">-'+fm(e.amt)+' บาท</div>'+(e.receipt?'<img style="width:100%;border-radius:16px" src="'+e.receipt+'" alt="ใบเสร็จ">':'<p class="sub">ไม่ได้แนบใบเสร็จ</p>')+'<button class="cta inline danger" data-act="delExp" data-id="'+e.id+'">ลบรายการนี้</button>')},
 delExp(t){if(!confirm('ลบรายจ่ายนี้?'))return;S.exps=S.exps.filter(e=>e.id!==t.dataset.id);save();closeSheet();draw()},
 addStu(){stuSheet()},editStu(t){stuSheet(S.students.find(s=>s.id===t.dataset.id))},
 saveBulk(){const n=parseNames($('sbulk').value);if(!n.length)return toast('วางรายชื่อก่อนนะ');let k=S.students.length;n.forEach(x=>S.students.push({id:uid('s'),no:String(++k),name:x}));save();closeSheet();draw();toast('เพิ่ม '+n.length+' คนแล้ว')},
 saveStu(t){const s=S.students.find(x=>x.id===t.dataset.id),n=$('snm').value.trim();if(!n)return toast('ใส่ชื่อก่อนนะ');s.name=n;s.no=$('sno').value.trim()||s.no;save();closeSheet();draw()},
 delStu(t){if(!confirm('ลบนักเรียนคนนี้และประวัติการจ่ายของเขา?'))return;const id=t.dataset.id;S.students=S.students.filter(s=>s.id!==id);S.pays=S.pays.filter(p=>p.sid!==id);save();closeSheet();draw()},
 editCls(){const c=S.cls;openSheet('<h2>ข้อมูลห้อง</h2><label style="margin-top:0">ชื่อห้อง</label><input type="text" id="ec1" value="'+esc(c.name)+'"><label>ภาคเรียน/ปี</label><input type="text" id="ec2" value="'+esc(c.term)+'"><label>ชื่อเหรัญญิก</label><input type="text" id="ec3" value="'+esc(c.treasurer)+'"><button class="cta inline" data-act="saveCls">บันทึก</button>')},
 saveCls(){if(!$('ec1').value.trim())return toast('ใส่ชื่อห้องก่อนนะ');S.cls={name:$('ec1').value.trim(),term:$('ec2').value.trim(),treasurer:$('ec3').value.trim()};save();closeSheet();draw()},
 copyUnpaid(){const r=S.rounds.find(x=>x.id===curR),u=unpaid(r);if(!u.length)return toast('ทุกคนจ่ายครบแล้ว');copyText('ค้างส่ง '+r.title+' ('+fm(r.amt)+' บาท)\n'+u.map(x=>{const rem=r.amt-paidOf(r.id,x.id);return x.no+'. '+x.name+' ('+fm(rem)+')'}).join('\n'),'คัดลอกรายชื่อคนค้างแล้ว')},
 shareSum(){const t=summaryText();if(navigator.share)navigator.share({text:t}).catch(()=>copyText(t,'คัดลอกสรุปแล้ว'));else copyText(t,'คัดลอกสรุปแล้ว')},
 csv(){const q2=s=>'"'+String(s).replace(/"/g,'""')+'"';const rows=[['เลขที่','ชื่อ'].concat(S.rounds.map(r=>r.title+' ('+r.amt+')'),['รวมจ่าย','ค้างรวม'])];
  S.students.forEach(s=>{let tot=0,rem=0;const cells=S.rounds.map(r=>{const p=paidOf(r.id,s.id);tot+=p;rem+=Math.max(0,r.amt-p);return p});rows.push([s.no,s.name].concat(cells,[tot,rem]))});
  rows.push([],['รับรวม',income()],['จ่ายรวม',spent()],['คงเหลือ',income()-spent()]);
  const data='\ufeff'+rows.map(r=>r.map(q2).join(',')).join('\r\n');if(!download('เงินห้อง-'+S.cls.name+'.csv','text/csv;charset=utf-8',data))openSheet('<h2>คัดลอกข้อมูล CSV</h2><textarea style="min-height:220px">'+esc(data)+'</textarea>');else toast('ส่งออกไฟล์แล้ว')},
 printRep(){const c=S.cls;$('printDoc').innerHTML='<h2>รายงานเงินห้อง '+esc(c.name)+'</h2><p>ภาคเรียน '+esc(c.term)+' · เหรัญญิก '+esc(c.treasurer)+' · ณ วันที่ '+fd(TODAY())+'</p><p>รับรวม '+fm(income())+' บาท · จ่ายรวม '+fm(spent())+' บาท · คงเหลือ <b>'+fm(income()-spent())+'</b> บาท</p>'+
  '<table><tr><th>เลขที่</th><th>ชื่อ</th>'+S.rounds.map(r=>'<th class="r">'+esc(r.title)+'<br>('+fm(r.amt)+')</th>').join('')+'<th class="r">ค้างรวม</th></tr>'+S.students.map(s=>{let rem=0;return '<tr><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td>'+S.rounds.map(r=>{const p=paidOf(r.id,s.id);rem+=Math.max(0,r.amt-p);return '<td class="r">'+(p?fm(p):'-')+'</td>'}).join('')+'<td class="r">'+(rem?fm(rem):'-')+'</td></tr>'}).join('')+'</table>'+
  '<h3 style="margin-top:16px">รายจ่าย</h3><table><tr><th>วันที่</th><th>รายการ</th><th class="r">บาท</th></tr>'+(S.exps.length?S.exps.map(e=>'<tr><td>'+fd(e.date)+'</td><td>'+esc(e.title)+'</td><td class="r">'+fm(e.amt)+'</td></tr>').join(''):'<tr><td colspan="3">ไม่มีรายจ่าย</td></tr>')+'</table>';
  setTimeout(()=>{try{window.print()}catch(e){toast('เบราว์เซอร์นี้พิมพ์ไม่ได้ ใช้ส่งออก CSV แทนได้')}},100)},
 backup(){if(!download('สำรองเงินห้อง-'+S.cls.name+'-'+TODAY()+'.json','application/json',JSON.stringify(S)))openSheet('<h2>คัดลอกข้อมูลสำรอง</h2><textarea style="min-height:220px">'+esc(JSON.stringify(S))+'</textarea>');else toast('สำรองข้อมูลแล้ว')},
 importJson(){const f=$('fileJson');f.value='';f.click()},
 wipe(){if(!confirm('ลบข้อมูลห้อง รายชื่อ และประวัติทั้งหมดบน Supabase และในเครื่องนี้?'))return;S=blank();save();view='setup';draw()}
};
$('fileJson').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!d.cls||!Array.isArray(d.students))throw 0;if(S.cls&&!confirm('กู้คืนจะแทนที่ข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อ?'))return;
  S=Object.assign(blank(),d);save();view='home';draw();toast('กู้คืนข้อมูลแล้ว')}catch(x){toast('ไฟล์สำรองไม่ถูกต้อง')}};fr.readAsText(f)});

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;const f=A[t.dataset.act];if(f){e.preventDefault();if(t.dataset.close)closeSheet();f(t,e)}});
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&e.target.dataset.act){const fn=A[e.target.dataset.act];if(fn)fn(e.target,e)}});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='qs'){
    const start=e.target.selectionStart,end=e.target.selectionEnd;q=e.target.value;const y=window.scrollY;draw();
    const next=$('qs');if(next){next.focus();try{next.setSelectionRange(start,end)}catch(_){}}window.scrollTo(0,y);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='pinCode')A.login();
  if(e.key==='Escape')closeSheet();
});

try{
  draw();
  if(isAuthed)loadFromCloud();
}catch(err){
  console.error('Application startup error:',err);
  const v=$('view');
  if(v)v.innerHTML='<div style="padding:28px"><h2>เปิดระบบไม่สำเร็จ</h2><p>เกิดข้อผิดพลาดระหว่างเริ่มต้นระบบ กรุณารีเฟรชหน้าเว็บ หรือตรวจสอบ Console</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">'+String(err&&err.message||err)+'</pre></div>';
}
</script>
</body>
</html>
