<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#1e88e5;--blue2:#5bb0f5;--orange:#c8500e;--orange2:#f47a20;--cream:#fffaee;
  --ink:#1f2a44;--muted:#6b7794;--green:#cdeed8;--greenInk:#1c6b3a;--line:#d3dbea;--bg:#eaf3ff;
  --red:#ffe1e1;--redInk:#b3261e;--yellow:#fff0c2;--yellowInk:#8a5a00;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
img{display:block;max-width:100%}
.im{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.hide{display:none!important}
#stage{display:flex;justify-content:center;gap:40px;align-items:flex-start;min-height:100vh;min-height:100dvh}
#phone{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:linear-gradient(#f5f2ff,#fdf0e6);box-shadow:0 0 40px rgba(30,60,120,.12)}
#view{flex:1;display:flex;flex-direction:column;padding-bottom:calc(86px + var(--sab))}
#view.noNav{padding-bottom:0}
#side{display:none}
@media(min-width:960px){
  body{background:radial-gradient(circle at 15% 20%,#ffe9c4 0,transparent 35%),radial-gradient(circle at 90% 80%,#ffd0e6 0,transparent 35%),#e6efff}
  #stage{padding:0 20px}
  #side{display:block;width:260px;margin-top:80px;background:var(--cream);border-radius:20px 20px 20px 36px;padding:24px;box-shadow:0 14px 30px rgba(60,70,140,.15);transform:rotate(1.2deg);position:sticky;top:60px}
  #side h4{font-size:18px;margin-bottom:6px}#side p{color:var(--muted);font-size:14px;line-height:1.6}
  #side button{margin-top:14px;padding:10px 18px;border-radius:99px;background:var(--orange);color:#fff;font-size:14px}
}
/* hero */
.hero{color:#fff;padding:calc(20px + var(--sat)) 20px 64px;border-radius:0 0 40px 40px;position:relative;
  background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.2px),linear-gradient(180deg,var(--blue),var(--blue2));background-size:18px 18px,100% 100%}
.hero.orange{background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.2px),linear-gradient(180deg,#f47a20,#fbb15c);background-size:18px 18px,100% 100%}
.hero.green{background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.2px),linear-gradient(180deg,#2e9e5b,#6fd19a);background-size:18px 18px,100% 100%}
.logo{font-weight:700;font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#69f0ae;display:inline-block;box-shadow:0 0 8px #69f0ae}
.sync-dot.busy{background:#ffd740;box-shadow:0 0 8px #ffd740;animation:pulse 1s infinite}
.sync-dot.err{background:#ff5252;box-shadow:0 0 8px #ff5252}
@keyframes pulse{50%{opacity:.4}}
.pill{position:absolute;right:20px;top:calc(24px + var(--sat));background:rgba(255,255,255,.28);padding:6px 14px;border-radius:99px;font-size:13px;color:#fff}
.back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;font-size:22px;line-height:1}
.hero h1{font-size:26px;font-weight:600;margin-top:18px;line-height:1.25;max-width:68%}
.hero p{opacity:.92;margin-top:6px;font-size:14px;max-width:68%}
.mascot{position:absolute;right:14px;bottom:30px;width:100px;height:100px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
/* cards */
.note,.card{background:var(--cream);box-shadow:0 12px 26px rgba(60,70,140,.12);position:relative}
.note{border-radius:22px 22px 22px 40px;padding:22px 18px;margin:-44px 18px 0;transform:rotate(-.5deg)}
.note::before,.pin::before{content:"";position:absolute;left:50%;top:-12px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a4d,var(--orange));box-shadow:0 4px 6px rgba(0,0,0,.2);z-index:1}
.card{border-radius:22px;padding:16px;margin-bottom:16px}
.card.pin{margin-top:18px}.card.plain{background:#fff}
.body{padding:18px}
.body h3{font-size:18px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}
.body h3 a{font-size:13px;color:var(--orange);font-weight:400;cursor:pointer}
label{font-size:14px;color:var(--muted);display:block;margin:12px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:13px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;-webkit-appearance:none;appearance:none;min-height:50px}
select{background-image:linear-gradient(45deg,transparent 50%,#6b7794 50%),linear-gradient(135deg,#6b7794 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{border-radius:18px;resize:none;min-height:96px;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--blue2)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;font-size:15px;text-align:center;transition:.15s}
.chip.on{background:var(--green);border-color:var(--green);color:var(--greenInk);font-weight:500}
.cta{display:block;width:calc(100% - 36px);margin:0 18px 18px;padding:17px;border-radius:99px;background:var(--orange);color:#fff;font-size:17px;font-weight:500;box-shadow:0 10px 20px rgba(200,80,14,.3);transition:.15s}
.cta:active,.chip:active,.btn:active{transform:scale(.97)}
.cta:disabled{opacity:.45;box-shadow:none}.cta.ghost{background:#fff;color:var(--orange);box-shadow:none}
.cta.inline{width:100%;margin:16px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:99px;font-size:14px;background:#fff;border:2px solid var(--line)}
.btn.p{background:var(--orange);border-color:var(--orange);color:#fff}.btn.sm{padding:6px 14px;font-size:13px}
.btn.g{background:var(--green);border-color:var(--green);color:var(--greenInk)}
.sub{color:var(--muted);font-size:13px}.hint{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}
.hint a{color:var(--orange);text-decoration:underline;cursor:pointer}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.money{font-variant-numeric:tabular-nums}
/* login pin */
.pin-input{text-align:center;font-size:28px;font-weight:700;letter-spacing:14px;padding-left:28px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* summary */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sumgrid div{background:#fff;border-radius:16px;padding:10px 12px}
.sumgrid small{display:block;color:var(--muted);font-size:12px}.sumgrid b{font-size:18px}
.in{color:var(--greenInk)}.out{color:var(--redInk)}
/* progress */
.bar{height:10px;border-radius:9px;background:#efe6d4;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#4caf7a,#2e9e5b);transition:width .4s}
.rcard{display:block;width:100%;text-align:left;background:var(--cream);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 8px 18px rgba(60,70,140,.1)}
.rcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rcard b{font-size:16px;font-weight:600}
.tag{display:inline-block;font-size:11px;border-radius:99px;padding:2px 10px;white-space:nowrap}
.tag.ok{background:var(--green);color:var(--greenInk)}.tag.part{background:var(--yellow);color:var(--yellowInk)}.tag.no{background:var(--red);color:var(--redInk)}.tag.due{background:#ffe4d3;color:var(--orange)}
/* list */
.list{background:#fff;border-radius:22px;padding:4px 16px;margin-bottom:16px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid #edf0f7;text-align:left}
.item:last-child{border:0}
.item .no{width:30px;height:30px;border-radius:50%;background:#e7f1ff;color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.item .nm{flex:1;min-width:0}.item .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ic{width:40px;height:40px;border-radius:12px;background:#fff1e6;padding:7px;flex:none}
.item .amt{font-weight:600;white-space:nowrap}
.search{margin-bottom:12px}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:#fff}
.photo{position:relative;border-radius:18px;overflow:hidden;margin-top:12px;background:#fff}
.photo img{width:100%;max-height:260px;object-fit:contain;background:#f3f5fa}
.photo button{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff}
.actionrow{display:flex;gap:10px;margin-top:12px}
.actionrow button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:2px solid #f0d8c4;border-radius:99px;padding:11px 6px;color:var(--orange);font-size:14px}
.actionrow .im{width:24px;height:24px}
.tabs{display:flex;background:#fff;border-radius:99px;padding:6px;margin:-30px 18px 14px;box-shadow:0 8px 20px rgba(60,70,140,.12);position:relative}
.tabs button{flex:1;padding:10px 4px;border-radius:99px;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--orange);color:#fff}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}.empty .ic{width:84px;margin:0 auto 8px}
/* nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-radius:28px 28px 0 0;display:flex;justify-content:space-around;padding:10px 4px calc(12px + var(--sab));box-shadow:0 -6px 20px rgba(0,0,0,.07);z-index:20}
#nav button{flex:1;font-size:11px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--orange)}
#nav .plus{transform:translateY(-24px)}
#nav .plus span{width:56px;height:56px;border-radius:50%;background:var(--orange2);display:grid;place-items:center;box-shadow:0 0 0 5px #fff,0 8px 14px rgba(244,122,32,.4);color:#fff}
#nav .plus svg{stroke:#fff;width:28px;height:28px}
/* sheet/toast */
#sheetBg{position:fixed;inset:0;background:rgba(20,30,60,.45);z-index:40;opacity:0;pointer-events:none;transition:.25s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:440px;background:var(--cream);border-radius:28px 28px 0 0;z-index:41;transform:translate(-50%,105%);transition:transform .3s;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 20px calc(24px + var(--sab))}
#sheet.on{transform:translate(-50%,0)}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:#d9cfb9;margin:0 auto 14px}
#sheet h2{font-size:21px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.fade{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#printDoc{display:none}
@media print{
  body>*{display:none!important}
  #printDoc{display:block!important;padding:16px;font-family:'Prompt',sans-serif;color:#000;background:#fff}
  #printDoc table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  #printDoc th,#printDoc td{border:1px solid #888;padding:4px 6px;text-align:left}
  #printDoc td.r,#printDoc th.r{text-align:right}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- FULL SCREEN RESPONSIVE LAYOUT ---------- */
html, body { width:100%; min-width:0; min-height:100%; }
body { margin:0; }
#stage { width:100%; min-height:100vh; min-height:100dvh; display:block; padding:0; }
#phone { width:100%; max-width:none; min-height:100vh; min-height:100dvh; box-shadow:none; }
#view { width:100%; min-height:100vh; min-height:100dvh; padding-bottom:calc(86px + var(--sab)); }
#view.noNav { padding-bottom:0; }
#side { display:none !important; }
#nav { left:0; transform:none; width:100%; max-width:none; }
#sheet { left:0; width:100%; max-width:none; transform:translateY(105%); }
#sheet.on { transform:translateY(0); }
.body { width:100%; max-width:none; }
@media (min-width:700px) {
  .body { padding-left:clamp(22px,4vw,64px); padding-right:clamp(22px,4vw,64px); }
  .note { margin-left:clamp(22px,4vw,64px); margin-right:clamp(22px,4vw,64px); }
  .hero { padding-left:clamp(24px,4vw,64px); padding-right:clamp(24px,4vw,64px); }
  .cta { width:calc(100% - 2 * clamp(22px,4vw,64px)); margin-left:clamp(22px,4vw,64px); margin-right:clamp(22px,4vw,64px); }
  .cta.inline { width:100%; margin-left:0; margin-right:0; }
}

/* ---------- BUTTON / OVERLAP FIX ---------- */
.hero { flex:0 0 auto; z-index:1; }
.body { position:relative; z-index:0; }
#view { min-width:0; }
#nav {
  min-height:76px;
  align-items:center;
  padding-top:10px;
  padding-bottom:calc(12px + var(--sab));
}
#nav button { min-height:48px; justify-content:center; position:relative; }
#nav .plus { transform:translateY(-18px); }
#nav .plus span { flex:0 0 56px; }
#sheet { box-sizing:border-box; }
@media (max-width:699px) {
  .hero { border-radius:0 0 34px 34px; }
}
@media (min-width:700px) {
  #nav { border-radius:28px 28px 0 0; }
}

</style>
</head>

/* ---------- state / storage / Supabase Sync ---------- */
const MEM={};const KEY='classfund_v1';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}};
let S;try{S=JSON.parse(store.get(KEY)||'null')}catch(e){S=null}
S=Object.assign({cls:null,students:[],rounds:[],pays:[],exps:[]},S||{});

let isAuthed = sessionStorage.getItem(AUTH_KEY) === '1';
let isLoadingCloud = false;
let syncState = 'ok'; // 'ok' | 'busy' | 'err'
let isApplyingRemote = false;

function setSyncStatus(st){
  syncState = st;
  document.querySelectorAll('.sync-dot').forEach(el=>{
    el.className = 'sync-dot' + (st==='busy'?' busy':st==='err'?' err':'');
  });
}

async function loadFromCloud(){
  isLoadingCloud = true;
  draw();
  setSyncStatus('busy');
  try{
    const { data, error } = await sb
      .from('class_fund_state')
      .select('data')
      .eq('id', DOC_ROW_ID)
      .maybeSingle();

    if(error) throw error;

    if(data && data.data && data.data.cls){
      S = Object.assign({cls:null,students:[],rounds:[],pays:[],exps:[]}, data.data);
      store.set(KEY, JSON.stringify(S));
    } else if (S.cls) {
      // มีข้อมูลเก่าในเครื่อง ให้ดันขึ้น Supabase
      await saveToCloud();
    }
    setSyncStatus('ok');
  }catch(e){
    console.error('Supabase load error:', e);
    setSyncStatus('err');
    toast('เชื่อมต่อฐานข้อมูลไม่ได้ ใช้ข้อมูลในเครื่องชั่วคราว');
  }finally{
    isLoadingCloud = false;
    view = S.cls ? 'home' : 'setup';
    draw();
  }
}

async function saveToCloud(){
  if(isApplyingRemote) return;
  setSyncStatus('busy');
  try{
    const { error } = await sb
      .from('class_fund_state')
      .upsert({
        id: DOC_ROW_ID,
        data: S,
        updated_at: new Date().toISOString()
      }, { onConflict: 'id' });
    if(error) throw error;
    setSyncStatus('ok');
  }catch(e){
    console.error('Supabase save error:', e);
    setSyncStatus('err');
    toast('บันทึกขึ้นคลาวด์ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือตาราง SQL');
  }
}

function save(){
  try{store.set(KEY,JSON.stringify(S))}catch(e){toast('พื้นที่เก็บข้อมูลในเครื่องเต็ม')}
  if(isAuthed) saveToCloud();
}

function subscribeRealtime(){
  sb.channel('class_fund_realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'class_fund_state', filter: 'id=eq.'+DOC_ROW_ID }, payload => {
      if(!isAuthed || !payload.new || !payload.new.data) return;
      const incoming = JSON.stringify(payload.new.data);
      if(incoming !== JSON.stringify(S)){
        isApplyingRemote = true;
        S = Object.assign({cls:null,students:[],rounds:[],pays:[],exps:[]}, payload.new.data);
        store.set(KEY, incoming);
        if(!S.cls) view = 'setup';
        else if(view === 'setup') view = 'home';
        draw();
        isApplyingRemote = false;
      }
    })
    .subscribe();
}

function confetti(){const c=$('fx'),x=c.getContext&&c.getContext('2d');if(!x)return;c.width=innerWidth;c.height=innerHeight;
 const P=[...Array(50)].map(()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6+3,c:['#f47a20','#5bb0f5','#ffd23f','#66bb6a'][Math.random()*4|0],l:55}));
 (function f(){x.clearRect(0,0,c.width,c.height);let a=0;P.forEach(p=>{if(p.l<=0)return;a++;p.l--;p.vy+=.5;p.x+=p.vx;p.y+=p.vy;x.globalAlpha=p.l/55;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(a)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- logic ---------- */
function paidOf(rid,sid){return S.pays.filter(p=>p.rid===rid&&p.sid===sid).reduce((a,p)=>a+p.amt,0)}
function stat(r){const n=S.students.length;let full=0,part=0,got=0;S.students.forEach(s=>{const p=paidOf(r.id,s.id);got+=Math.min(p,r.amt)+Math.max(0,p-r.amt);if(p>=r.amt)full++;else if(p>0)part++});
 return {n,full,part,none:n-full-part,got,target:r.amt*n,pct:n?Math.round(full/n*100):0,over:r.due&&r.due<TODAY()}}
const income=()=>S.pays.reduce((a,p)=>a+p.amt,0);
const spent=()=>S.exps.reduce((a,e)=>a+e.amt,0);
function unpaid(r){return S.students.filter(s=>paidOf(r.id,s.id)<r.amt)}
function summaryText(){const c=S.cls;let t='สรุปเงินห้อง '+c.name+' ('+c.term+')\nอัปเดต '+fd(TODAY())+'\n';
 t+='\nรับรวม '+fm(income())+' บาท\nจ่ายรวม '+fm(spent())+' บาท\nคงเหลือ '+fm(income()-spent())+' บาท\n';
 S.rounds.forEach(r=>{const s=stat(r);t+='\n'+r.title+' ('+fm(r.amt)+' บาท/คน)\nจ่ายแล้ว '+s.full+'/'+s.n+' คน';const u=unpaid(r);if(u.length)t+='\nค้าง: '+u.map(x=>x.name).join(', ');t+='\n'});
 t+='\n- '+c.treasurer+' เหรัญญิก';return t}
function copyText(t,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(msg||'คัดลอกแล้ว'),()=>fallbackCopy(t,msg));else fallbackCopy(t,msg)}
function fallbackCopy(t,msg){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg||'คัดลอกแล้ว')}catch(e){openSheet('<h2>คัดลอกข้อความนี้</h2><textarea style="min-height:220px">'+esc(t)+'</textarea>')}document.body.removeChild(a)}
function download(name,type,data){try{const b=new Blob([data],{type:type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}}

function draw(){
  let activeView = view;
  if(!isAuthed) activeView = 'login';
  else if(isLoadingCloud) activeView = 'loading';
  else if(!S.cls) activeView = 'setup';

  const v=$('view');
  v.innerHTML=VIEWS[activeView]();
  const sn=!!NAVV[activeView];
  v.className=sn?'':'noNav';
  const nav=$('nav');
  nav.className=sn?'':'hide';
  const cur=activeView==='round'?'rounds':activeView;
  nav.innerHTML=NAV.map(n=>'<button class="'+(n[1]==='plus'?'plus ':'')+(cur===n[0]?'on':'')+'" data-act="go" data-v="'+n[0]+'">'+(n[1]==='plus'?'<span>'+ICON.plus+'</span>':ICON[n[1]])+n[2]+'</button>').join('');
}

 addStu(){stuSheet()},editStu(t){stuSheet(S.students.find(s=>s.id===t.dataset.id))},
 saveBulk(){const n=parseNames($('sbulk').value);if(!n.length)return toast('วางรายชื่อก่อนนะ');let k=S.students.length;n.forEach(x=>S.students.push({id:uid('s'),no:String(++k),name:x}));save();closeSheet();draw();toast('เพิ่ม '+n.length+' คนแล้ว')},
 saveStu(t){const s=S.students.find(x=>x.id===t.dataset.id),n=$('snm').value.trim();if(!n)return toast('ใส่ชื่อก่อนนะ');s.name=n;s.no=$('sno').value.trim()||s.no;save();closeSheet();draw()},
 delStu(t){if(!confirm('ลบนักเรียนคนนี้และประวัติการจ่ายของเขา?'))return;const id=t.dataset.id;S.students=S.students.filter(s=>s.id!==id);S.pays=S.pays.filter(p=>p.sid!==id);save();closeSheet();draw()},
 editCls(){const c=S.cls;openSheet('<h2>ข้อมูลห้อง</h2><label style="margin-top:0">ชื่อห้อง</label><input type="text" id="ec1" value="'+esc(c.name)+'"><label>ภาคเรียน/ปี</label><input type="text" id="ec2" value="'+esc(c.term)+'"><label>ชื่อเหรัญญิก</label><input type="text" id="ec3" value="'+esc(c.treasurer)+'"><button class="cta inline" data-act="saveCls">บันทึก</button>')},
 saveCls(){if(!$('ec1').value.trim())return toast('ใส่ชื่อห้องก่อนนะ');S.cls={name:$('ec1').value.trim(),term:$('ec2').value.trim(),treasurer:$('ec3').value.trim()};save();closeSheet();draw()},
 copyUnpaid(){const r=S.rounds.find(x=>x.id===curR),u=unpaid(r);if(!u.length)return toast('ทุกคนจ่ายครบแล้ว');copyText('ค้างส่ง '+r.title+' ('+fm(r.amt)+' บาท)\n'+u.map(x=>{const rem=r.amt-paidOf(r.id,x.id);return x.no+'. '+x.name+' ('+fm(rem)+')'}).join('\n'),'คัดลอกรายชื่อคนค้างแล้ว')},
 shareSum(){const t=summaryText();if(navigator.share)navigator.share({text:t}).catch(()=>copyText(t,'คัดลอกสรุปแล้ว'));else copyText(t,'คัดลอกสรุปแล้ว')},
 csv(){const q2=s=>'"'+String(s).replace(/"/g,'""')+'"';const rows=[['เลขที่','ชื่อ'].concat(S.rounds.map(r=>r.title+' ('+r.amt+')'),['รวมจ่าย','ค้างรวม'])];
  S.students.forEach(s=>{let tot=0,rem=0;const cells=S.rounds.map(r=>{const p=paidOf(r.id,s.id);tot+=p;rem+=Math.max(0,r.amt-p);return p});rows.push([s.no,s.name].concat(cells,[tot,rem]))});
  rows.push([],['รับรวม',income()],['จ่ายรวม',spent()],['คงเหลือ',income()-spent()]);
  const data='﻿'+rows.map(r=>r.map(q2).join(',')).join('\r\n');if(!download('เงินห้อง-'+S.cls.name+'.csv','text/csv;charset=utf-8',data))openSheet('<h2>คัดลอกข้อมูล CSV</h2><textarea style="min-height:220px">'+esc(data)+'</textarea>');else toast('ส่งออกไฟล์แล้ว')},
 printRep(){const c=S.cls;$('printDoc').innerHTML='<h2>รายงานเงินห้อง '+esc(c.name)+'</h2><p>ภาคเรียน '+esc(c.term)+' · เหรัญญิก '+esc(c.treasurer)+' · ณ วันที่ '+fd(TODAY())+'</p><p>รับรวม '+fm(income())+' บาท · จ่ายรวม '+fm(spent())+' บาท · คงเหลือ <b>'+fm(income()-spent())+'</b> บาท</p>'+
  '<table><tr><th>เลขที่</th><th>ชื่อ</th>'+S.rounds.map(r=>'<th class="r">'+esc(r.title)+'<br>('+fm(r.amt)+')</th>').join('')+'<th class="r">ค้างรวม</th></tr>'+S.students.map(s=>{let rem=0;return '<tr><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td>'+S.rounds.map(r=>{const p=paidOf(r.id,s.id);rem+=Math.max(0,r.amt-p);return '<td class="r">'+(p?fm(p):'-')+'</td>'}).join('')+'<td class="r">'+(rem?fm(rem):'-')+'</td></tr>'}).join('')+'</table>'+
  '<h3 style="margin-top:16px">รายจ่าย</h3><table><tr><th>วันที่</th><th>รายการ</th><th class="r">บาท</th></tr>'+(S.exps.length?S.exps.map(e=>'<tr><td>'+fd(e.date)+'</td><td>'+esc(e.title)+'</td><td class="r">'+fm(e.amt)+'</td></tr>').join(''):'<tr><td colspan="3">ไม่มีรายจ่าย</td></tr>')+'</table>';
  setTimeout(()=>{try{window.print()}catch(e){toast('เบราว์เซอร์นี้พิมพ์ไม่ได้ ใช้ส่งออก CSV แทนได้')}},100)},
 backup(){if(!download('สำรองเงินห้อง-'+S.cls.name+'-'+TODAY()+'.json','application/json',JSON.stringify(S)))openSheet('<h2>คัดลอกข้อมูลสำรอง</h2><textarea style="min-height:220px">'+esc(JSON.stringify(S))+'</textarea>');else toast('สำรองข้อมูลแล้ว')},
 importJson(){const f=$('fileJson');f.value='';f.click()},
 wipe(){if(!confirm('ลบข้อมูลห้อง รายชื่อ และประวัติทั้งหมดบน Supabase และในเครื่องนี้?'))return;S={cls:null,students:[],rounds:[],pays:[],exps:[]};save();view='setup';draw()},
 copyLink(){const u=location.href.split('#')[0];if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('คัดลอกลิงก์แล้ว'),()=>toast(u));else toast(u)}
};
$('fileJson').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!d.cls||!Array.isArray(d.students))throw 0;if(S.cls&&!confirm('กู้คืนจะแทนที่ข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อ?'))return;
  S=Object.assign({cls:null,students:[],rounds:[],pays:[],exps:[]},d);save();view='home';draw();toast('กู้คืนข้อมูลแล้ว')}catch(x){toast('ไฟล์สำรองไม่ถูกต้อง')}};fr.readAsText(f)});

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('change',e=>{
  if(e.target.tagName==='SELECT' && e.target.dataset.act){
    const fn=A[e.target.dataset.act];
    if(fn) fn(e.target,e);
  }
});
document.addEventListener('input',e=>{
  if(e.target && e.target.id==='qs'){
    const start=e.target.selectionStart, end=e.target.selectionEnd;
    q=e.target.value;
    const y=window.scrollY;
    draw();
    const next=$('qs');
    if(next){next.focus();try{next.setSelectionRange(start,end)}catch(_){}}
    window.scrollTo(0,y);
  }
});

// Start the interface immediately; cloud sync runs only after login.
try {
  draw();
  if(isAuthed) loadFromCloud();
} catch(err) {
  console.error('Application startup error:',err);
  const v=$('view');
  if(v) v.innerHTML='<div style="padding:28px;font-family:Prompt,sans-serif"><h2>เปิดระบบไม่สำเร็จ</h2><p>เกิดข้อผิดพลาดระหว่างเริ่มต้นระบบ กรุณารีเฟรชหน้าเว็บ หรือตรวจสอบ Console</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">'+String(err && err.message || err)+'</pre></div>';
}
</script>
</body>
</html>
